<style>
:root{--bg:#050505;--cd:#111113;--tx:#f5f1e6;--mu:#a39c88;--pr:#d4a017;--pr2:#2a2310;--bd:#2a2a2d;--ok:#22c55e;--wn:#d97706;--er:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f3ea;--cd:#fff;--tx:#1a1a1a;--mu:#6f6a58;--pr:#b8860b;--pr2:#fbf3dc;--bd:#e6dfcb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.55}
.top{background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}.lg{font-weight:900;font-size:20px;color:var(--pr);letter-spacing:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}
.tb{flex:none;border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tb.on{background:var(--pr);color:var(--onpr,#111);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:14px}
.bn{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}.k b{display:block;font-size:26px;color:var(--pr)}.k span{color:var(--mu);font-size:13px}

.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:130px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}
.bt{background:var(--pr);color:var(--onpr,#111);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
.bt.g{background:var(--pr2);color:var(--pr)}.bt.r{background:#fee2e2;color:var(--er)}.bt.w{background:#dcfce7;color:#166534}.bt.s{padding:5px 10px;font-size:13px}

.it .i{flex:1;min-width:170px}.it small{color:var(--mu);display:block}.ac{display:flex;gap:6px;flex-wrap:wrap}
.pl{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.a{background:#dcfce7;color:#166534}.s{background:#fef3c7;color:#92400e}.x{background:#fee2e2;color:#991b1b}.f{background:#e0e7ff;color:#3730a3}
.em{text-align:center;color:var(--mu);padding:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}.ov.show{display:flex}
.sh{background:var(--cd);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.row{display:flex;gap:8px}.row>*{flex:1}

.lgi{height:50px;width:auto;border-radius:10px;background:#000}
#sp{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#f5f1e6;transition:opacity .5s}
#sp img{width:min(300px,70vw);height:auto}#sp h1{margin:6px 0 4px;font-size:30px;letter-spacing:6px;color:var(--pr)}#sp p{margin:0 0 26px;color:#a39c88}
#sp .bt{padding:13px 40px;font-size:16px;border-radius:999px}
.ch{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.ch div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.ch i{display:block;background:linear-gradient(180deg,#f0c040,#a67c00);border-radius:6px 6px 0 0;min-height:3px}.ch b{font-size:11px;color:var(--tx)}
.rc{text-align:center}.rc img{height:90px;border-radius:10px;background:#000}.rc table{width:100%;text-align:right;margin:12px 0;border-collapse:collapse}.rc td{padding:7px 0;border-bottom:1px dashed var(--bd)}

function dash(){const mo=td().slice(0,7);const inc=D.pay.filter(p=>p.date.startsWith(mo)).reduce((a,b)=>a+ +b.amt,0),ex=D.exp.filter(p=>p.date.startsWith(mo)).reduce((a,b)=>a+ +b.amt,0);
 const act=D.members.filter(m=>stt(m)[1]==="a"||stt(m)[1]==="s").length,tdAtt=D.att.filter(a=>a.date===td()).length;
 return (soon().length?`<div class="bn" data-t="6">⚠️ ${soon().length} اشتراك هينتهي خلال ${SOON} أيام – اضغط للتفاصيل</div>`:"")+
 `<div class="kp"><div class="k"><b>${act}</b><span>أعضاء نشطين</span></div><div class="k"><b>${D.members.filter(m=>!m.frozen&&dl(m.end)<0).length}</b><span>اشتراكات منتهية</span></div><div class="k"><b>${tdAtt}</b><span>حضور النهاردة</span></div><div class="k"><b>${inc}</b><span>إيراد الشهر</span></div><div class="k"><b>${ex}</b><span>مصروفات الشهر</span></div><div class="k"><b>${inc-ex}</b><span>صافي الربح</span></div><div class="k"><b>${debtLeft()}</b><span>ديون مستحقة</span></div><div class="k"><b>${advLeft()}</b><span>سلف قائمة</span></div></div>
 ${chart()}<div class="cd"><h3>آخر الحضور</h3>${D.att.slice(-5).reverse().map(a=>`<div class="it"><div class="i">${E(D.members.find(m=>m.id===a.mid)?.name||"-")}<small>${a.date} · ${a.time}</small></div></div>`).join("")||'<div class="em">لسه مفيش حضور</div>'}</div>
 ${D.members.length?"":`<div class="cd em">ابدأ بإضافة الباقات والأعضاء، أو <button class="bt g" data-a="demo">حمّل بيانات تجريبية</button></div>`}`}
function members(){let L=D.members.filter(m=>(m.name+m.phone).toLowerCase().includes(q.toLowerCase())&&(flt==="all"||stt(m)[1]===flt));
 return `<div class="bar"><input id="q" placeholder="🔍 اسم أو رقم..." value="${E(q)}"><select id="fl">${[["all","الكل"],["a","نشط"],["s","قرب الانتهاء"],["x","منتهي"],["f","مجمد"]].map(o=>`<option value="${o[0]}" ${flt===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><button class="bt" data-a="addM">+ عضو جديد</button></div>
 <div class="cd">${L.map(m=>{const s=stt(m);return `<div class="it"><div class="i">${ph(m)}<b>${E(m.name)}</b> <span class="pl ${s[1]}">${s[0]}</span><small>📞 ${E(m.phone)} · ${pn(m.plan)} · حتى ${m.end} · مدرب: ${tn(m.trainer)}</small></div><div class="ac"><button class="bt s w" data-a="renew" data-i="${m.id}">تجديد</button><button class="bt s g" data-a="prof" data-i="${m.id}">👤 ملف</button><button class="bt s g" data-a="addD" data-i="${m.id}">💰 دين</button><button class="bt s g" data-a="card" data-i="${m.id}">🎫 كارت</button><button class="bt s g" data-a="meas" data-i="${m.id}">📏 قياسات</button><button class="bt s g" data-a="editM" data-i="${m.id}">تعديل</button><button class="bt s g" data-a="frz" data-i="${m.id}">${m.frozen?"إلغاء التجميد":"تجميد"}</button>${ROLE==="admin"?`<button class="bt s r" data-a="delM" data-i="${m.id}">حذف</button>`:""}</div></div>`}).join("")||'<div class="em">مفيش أعضاء</div>'}</div>`}
function att(){const t=D.att.filter(a=>a.date===td());return `<div class="cd"><h3>تسجيل حضور</h3><div class="bar"><input id="aq" placeholder="اسم العضو / كود الكارت / آخر أرقام الموبايل"><button class="bt" data-a="chk">تسجيل</button><button class="bt g" data-a="scan">📷 مسح QR</button></div><div id="am"></div></div><div class="cd"><h3>حضور النهاردة (${t.length})</h3>${t.map(a=>`<div class="it"><div class="i">${E(D.members.find(m=>m.id===a.mid)?.name||"-")}<small>${a.time}</small></div></div>`).join("")||'<div class="em">لسه مفيش</div>'}</div>`}
function fin(){const P=[...D.pay.map(p=>({...p,k:"+",t:E(p.store?("بيع: "+p.store):(D.members.find(m=>m.id===p.mid)?.name||"اشتراك"))})),...D.exp.map(p=>({...p,k:"-",t:E(p.t)}))].sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="bar"><button class="bt" data-a="addX">+ مصروف جديد</button><button class="bt g" data-a="csv">⬇ تصدير CSV</button><button class="bt g" data-a="bak">💾 نسخة احتياطية</button><button class="bt g" data-a="rst">📂 استرجاع</button></div><div class="cd">${P.slice(0,60).map(p=>`<div class="it"><div class="i">${p.t}<small>${p.date}</small></div><div class="ac"><b style="color:var(--${p.k==="+"?"ok":"er"})">${p.k}${p.amt}</b>${p.k==="+"?`<button class="bt s g" data-a="rcp" data-i="${p.id}">🧾 إيصال</button>`:""}<button class="bt s g" data-a="epay" data-i="${p.id}">✏️ تعديل</button></div></div>`).join("")||'<div class="em">مفيش حركات</div>'}</div>`}
function plans(){return `<div class="bar"><button class="bt" data-a="addP">+ باقة جديدة</button><button class="bt g" data-a="addCp">+ كوبون</button></div><div class="cd">${D.plans.map(p=>`<div class="it"><div class="i"><b>${E(p.name)}</b><small>${p.days} يوم · ${p.price} جنيه</small></div><div class="ac"><button class="bt s g" data-a="editP" data-i="${p.id}">تعديل</button><button class="bt s r" data-a="delP" data-i="${p.id}">حذف</button></div></div>`).join("")||'<div class="em">أضف باقات (شهري، 3 شهور، سنوي...)</div>'}</div>${cpList()}`}
function trainers(){return `<div class="bar"><button class="bt" data-a="addT">+ مدرب جديد</button></div><div class="cd">${D.trainers.map(p=>`<div class="it"><div class="i"><b>${E(p.name)}</b><small>📞 ${E(p.phone)} · ${D.members.filter(m=>m.trainer===p.id).length} متدرب</small></div><div class="ac"><button class="bt s w" data-a="addA" data-i="${p.id}">+ سلفة</button><button class="bt s r" data-a="delT" data-i="${p.id}">حذف</button></div></div>`).join("")||'<div class="em">مفيش مدربين</div>'}</div>${advList()}`}
